[package]
name = "clypra"
version = "1.4.4"
description = "A modern, open-source video editor with native performance and GPU-accelerated preview"
authors = ["Clypra Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clypra-native-core = { path = "../crates/clypra-native-core" }
tauri = { version = "2.11", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "sync"] }
tokio-util = "0.7"
rayon = "1.10"
base64 = "0.22"
md5 = "0.7"
walkdir = "2"
dashmap = "6"
crossbeam = "0.8"
web-time = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
parking_lot = "0.12"
log = "0.4"

# Cross-platform native audio output and hardware-clock adapter.
cpal = "0.18.2"
rtrb = "0.3"

# Native GPU rendering via wgpu
wgpu = "24.0"
bytemuck = { version = "1.21", features = ["derive"] }
memmap2 = "0.9"

# Native FFmpeg bindings for fast thumbnail extraction
# ffmpeg-next "9" / ffmpeg-sys-next "9" target FFmpeg 8.x system libraries
ffmpeg-next = "9"
ffmpeg-sys-next = "9"

# Image encoding for native decoder frame output
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
whisper-rs = "0.16.0"

# On-device AI inference via ONNX Runtime (MediaPipe face tracking, auto-reframe)
ort = { version = "2.0.0-rc.13", features = ["copy-dylibs"] }
ndarray = "0.17"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
