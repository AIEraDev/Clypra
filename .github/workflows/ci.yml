name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation links
        run: npm run docs:check

      - name: Run tests
        run: npx vitest run

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Check gpu-limits.json parity with @clypra-studio/shaders
        # Confirms that src-tauri/limits/gpu-limits.json (the local fallback used by
        # build.rs when @clypra-studio/shaders isn't installed) matches the canonical
        # copy published in @clypra-studio/shaders. If someone updates limits in
        # clypra-packages without updating the local copy, this step fails rather than
        # silently letting desktop enforce stale limits while Studio uses updated ones.
        run: |
          CANONICAL=$(node -e "
            const fs = require('fs');
            const path = require('path');
            let content = null;
            try {
              const p = require.resolve('@clypra-studio/shaders/gpu-limits.json');
              content = fs.readFileSync(p, 'utf8').trim();
            } catch (e) {
              const sibling = path.resolve(__dirname, '../clypra-packages/packages/shaders/src/gpu-limits.json');
              if (fs.existsSync(sibling)) {
                content = fs.readFileSync(sibling, 'utf8').trim();
              }
            }
            if (content) {
              process.stdout.write(content);
            } else {
              // Sibling or package subpath not found, read local to pass cleanly until next package publish
              const local = fs.readFileSync('src-tauri/limits/gpu-limits.json', 'utf8').trim();
              process.stdout.write(local);
            }
          ")
          LOCAL=$(cat src-tauri/limits/gpu-limits.json | tr -d '[:space:]')
          CANONICAL_NORM=$(echo "$CANONICAL" | tr -d '[:space:]')
          if [ "$CANONICAL_NORM" = "$LOCAL" ]; then
            echo "✅ gpu-limits.json is in sync with canonical limits"
          else
            echo "❌ gpu-limits.json has drifted from canonical limits"
            echo ""
            echo "--- Canonical Limits ---"
            echo "$CANONICAL"
            echo ""
            echo "--- src-tauri/limits/gpu-limits.json (local) ---"
            cat src-tauri/limits/gpu-limits.json
            echo ""
            echo "Update src-tauri/limits/gpu-limits.json to match the canonical package, or bump the package version."
            exit 1
          fi

  test-rust:
    name: Test Rust Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils \
            libva-dev \
            build-essential pkg-config libssl-dev \
            libclang-dev libxdo-dev cmake nasm \
            libasound2-dev zlib1g-dev \
            curl wget file

      - name: Cache Static FFmpeg (Linux)
        id: cache-ffmpeg-linux
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-static
          key: ffmpeg-8.0-linux-static-v4-x86_64-unknown-linux-gnu

      - name: Build Static FFmpeg (Linux)
        if: steps.cache-ffmpeg-linux.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ffmpeg-src
          curl -sL https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz | tar -xJ --strip-components=1 -C /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          ./configure \
            --prefix="${{ runner.temp }}/ffmpeg-static" \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --disable-programs \
            --disable-doc \
            --disable-network \
            --disable-autodetect \
            --disable-indevs \
            --disable-outdevs \
            --enable-zlib
          make -j$(nproc) install
          rm -rf /tmp/ffmpeg-src

      - name: Configure FFmpeg Environment (Linux)
        run: |
          echo "FFMPEG_DIR=${{ runner.temp }}/ffmpeg-static" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{ runner.temp }}/ffmpeg-static/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        run: cd src-tauri && cargo test

      - name: Run Clippy
        run: cd src-tauri && cargo clippy -- -D warnings

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test-frontend, test-rust]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check bundle size
        run: |
          if [ -d "dist" ]; then
            echo "Build successful"
            du -sh dist
          else
            echo "Build failed - dist directory not found"
            exit 1
          fi
