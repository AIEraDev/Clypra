name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    name: Build & Release (${{ matrix.platform }} - ${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (.dmg)
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            vcpkg_triplet: ""
            args: "--target aarch64-apple-darwin"

          # macOS Intel (.dmg)
          - platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            vcpkg_triplet: ""
            args: "--target x86_64-apple-darwin"

          # Windows x64 (.exe, .msi)
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            vcpkg_triplet: "x64-windows-static-md"
            args: ""

          # Linux x64 (.deb, .AppImage, .tar.gz)
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            vcpkg_triplet: ""
            args: ""

          # Linux ARM64 (.deb, .AppImage, .tar.gz)
          - platform: "ubuntu-24.04-arm"
            target: "aarch64-unknown-linux-gnu"
            vcpkg_triplet: ""
            args: "--target aarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils \
            libva-dev \
            build-essential pkg-config libssl-dev \
            libclang-dev libxdo-dev cmake nasm \
            libasound2-dev zlib1g-dev

      - name: Cache Static FFmpeg (Linux)
        if: runner.os == 'Linux'
        id: cache-ffmpeg-linux
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-static
          key: ffmpeg-8.0-linux-static-v5-${{ matrix.target }}

      - name: Build Static FFmpeg (Linux)
        if: runner.os == 'Linux' && steps.cache-ffmpeg-linux.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ffmpeg-src
          curl -sL https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz | tar -xJ --strip-components=1 -C /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          ./configure \
            --prefix="${{ runner.temp }}/ffmpeg-static" \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --disable-programs \
            --disable-doc \
            --disable-network \
            --disable-autodetect \
            --disable-indevs \
            --disable-outdevs \
            --enable-zlib
          make -j$(nproc) install
          rm -rf /tmp/ffmpeg-src

      - name: Configure FFmpeg Environment (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "FFMPEG_DIR=${{ runner.temp }}/ffmpeg-static" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{ runner.temp }}/ffmpeg-static/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Build Glibc / C++ Compatibility Shim (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ${{ runner.temp }}/compat
          gcc -c -fPIC scripts/glibc_compat.c -o ${{ runner.temp }}/compat/glibc_compat.o
          echo "RUSTFLAGS=-C link-arg=${{ runner.temp }}/compat/glibc_compat.o ${RUSTFLAGS:-}" >> $GITHUB_ENV

      # ── macOS ──────────────────────────────────────────────────────────────
      # whisper-rs-sys builds ggml via cmake. The only reliable way to set
      # the deployment target for cmake sub-builds inside cargo is via the
      # SDKROOT + MACOSX_DEPLOYMENT_TARGET env pair AND setting
      # CMAKE_OSX_DEPLOYMENT_TARGET through CARGO_BUILD_TARGET_DIR cmake
      # passthrough. We use a .cargo/config.toml [env] block (committed) to
      # guarantee cmake sees the flag, and also set it here for safety.
      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config nasm

      - name: Cache Static FFmpeg (macOS)
        if: runner.os == 'macOS'
        id: cache-ffmpeg-macos
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-static
          key: ffmpeg-8.0-darwin-static-v2-${{ matrix.target }}

      - name: Build Static FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.cache-ffmpeg-macos.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/ffmpeg-src
          curl -sL https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz | tar -xJ --strip-components=1 -C /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          ./configure \
            --prefix="${{ runner.temp }}/ffmpeg-static" \
            --enable-static \
            --disable-shared \
            --enable-pic \
            --disable-programs \
            --disable-doc \
            --disable-network \
            --disable-autodetect \
            --disable-indevs \
            --disable-outdevs \
            --enable-videotoolbox \
            --enable-audiotoolbox \
            --disable-xlib \
            --disable-libxcb \
            --disable-indev=xcbgrab
          make -j$(sysctl -n hw.ncpu) install
          rm -rf /tmp/ffmpeg-src

      - name: Configure FFmpeg Environment (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "FFMPEG_DIR=${{ runner.temp }}/ffmpeg-static" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${{ runner.temp }}/ffmpeg-static/lib/pkgconfig" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      # ── Windows ────────────────────────────────────────────────────────────
      # LLVM is already available on windows-latest at C:\Program Files\LLVM
      # (installed by the runner image). Just set LIBCLANG_PATH.
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvm) {
            echo "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
            Write-Host "Using runner LLVM at $llvm"
          } else {
            choco install llvm -y --no-progress
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          }

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cd C:\vcpkg
          git pull --quiet
          vcpkg install ffmpeg[core,avcodec,avdevice,avfilter,avformat,swresample,swscale]:${{ matrix.vcpkg_triplet }}
          echo "FFMPEG_DIR=C:/vcpkg/installed/${{ matrix.vcpkg_triplet }}" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/${{ matrix.vcpkg_triplet }}/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=${{ matrix.vcpkg_triplet }}" >> $env:GITHUB_ENV

      # ── Toolchain ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        run: npm ci

      # ── Static FFmpeg Sidecars ─────────────────────────────────────────────
      # Ensures authentic, standalone GPL FFmpeg and FFprobe binaries with
      # hardware acceleration and software codecs (x264, x265, prores, vp9)
      # are cryptographically verified against pinned SHA-256 digests and
      # bundled into release artifacts (replaces development stub wrappers).
      - name: Setup Verified Static FFmpeg Sidecars (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/setup-sidecars.sh --target ${{ matrix.target }} --force

      - name: Setup Verified Static FFmpeg Sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-sidecars.ps1 -Target ${{ matrix.target }} -Force

      - name: Verify bundled media runtime
        run: node scripts/verify-sidecars.mjs --target ${{ matrix.target }}

      - name: Run Vitest Suite
        run: npx vitest run

      - name: Run Cargo Test Suite
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ── macOS code-signing setup ───────────────────────────────────────────
      # Imports the Developer ID Application certificate into a temporary
      # keychain so codesign and the Tauri bundler can find it.
      - name: Import Apple Developer ID Certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode the base64-encoded .p12 certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make it the default so codesign picks it up
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      # ── Release ────────────────────────────────────────────────────────────
      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Clypra v__VERSION__"
          releaseBody: "Automated multi-platform release bundle — macOS (arm64, x64), Windows (x64, arm64), Linux (x64, arm64)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          retryAttempts: 3

  sync-updater-manifests:
    name: Sync latest.json and updater.json
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Duplicate latest.json as updater.json and convert to Direct Public URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME=$(gh release view --json tagName -q .tagName --repo ${{ github.repository }})
          fi
          echo "Syncing manifests for release: $TAG_NAME"
          gh release download "$TAG_NAME" -p "latest.json" --repo ${{ github.repository }} --dir /tmp

          # Map GitHub API asset URLs to public direct download URLs
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const repo = process.env.GITHUB_REPOSITORY || "${{ github.repository }}";
            const tag = "'"$TAG_NAME"'";
            const releaseInfo = JSON.parse(execSync(`gh release view "${tag}" --json assets --repo "${repo}"`).toString());
            const assetMap = new Map();
            for (const asset of releaseInfo.assets) {
              if (asset.apiUrl) {
                assetMap.set(asset.apiUrl, asset.url);
              }
              if (asset.id) {
                assetMap.set(`https://api.github.com/repos/${repo}/releases/assets/${asset.id}`, asset.url);
                assetMap.set(`https://api.github.com/repos/AIEraDev/Clypra/releases/assets/${asset.id}`, asset.url);
                assetMap.set(`https://api.github.com/repos/AIEraDev/clypra/releases/assets/${asset.id}`, asset.url);
              }
            }

            const manifest = JSON.parse(fs.readFileSync("/tmp/latest.json", "utf8"));
            if (manifest.platforms) {
              for (const [platform, data] of Object.entries(manifest.platforms)) {
                if (data.url && data.url.includes("api.github.com")) {
                  const directUrl = assetMap.get(data.url);
                  if (directUrl) {
                    console.log(`Rewriting ${platform} URL from ${data.url} to ${directUrl}`);
                    data.url = directUrl;
                  }
                }
              }
            }

            const updatedJson = JSON.stringify(manifest, null, 2);
            fs.writeFileSync("/tmp/latest.json", updatedJson);
            fs.writeFileSync("/tmp/updater.json", updatedJson);
          '

          gh release upload "$TAG_NAME" /tmp/latest.json /tmp/updater.json --clobber --repo ${{ github.repository }}
          echo "Successfully converted and published both latest.json and updater.json with direct public download URLs!"
