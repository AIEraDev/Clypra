name: "Publish Release"

on:
  push:
    tags:
      - "v*" # Trigger on version tag push, e.g. v1.2.3
  workflow_dispatch: # Allow manual workflow dispatch

jobs:
  publish-tauri:
    name: Build & Release (${{ matrix.platform }}${{ matrix.target && format(' - {0}', matrix.target) || '' }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native arm64 only — cross-compiling x86_64 on Apple Silicon breaks
          # FFmpeg pkg-config discovery (see v1.2.2 release workflow).
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
          - platform: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      # whisper.cpp uses std::filesystem (requires macOS 10.15+)
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Linux Native System Dependencies (WebKitGTK, VA-API, FFmpeg Dev)
      # ubuntu-24.04 ships FFmpeg 6.x+ required by ffmpeg-next 8 (22.04 has 4.x)
      # ------------------------------------------------------------------------
      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libva-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            libavfilter-dev \
            libpostproc-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libclang-dev \
            libxdo-dev

      # ------------------------------------------------------------------------
      # macOS FFmpeg via Homebrew
      # ------------------------------------------------------------------------
      - name: Install FFmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install ffmpeg pkg-config
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> $GITHUB_ENV

      # ------------------------------------------------------------------------
      # Windows FFmpeg via vcpkg (ffmpeg-sys-next discovers via VCPKGRS_TRIPLET)
      # ------------------------------------------------------------------------
      - name: Install FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          vcpkg install ffmpeg:x64-windows-static-md
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      # ------------------------------------------------------------------------
      # Toolchains & Cache Setup
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ------------------------------------------------------------------------
      # Install Dependencies & Run Verification Suites
      # ------------------------------------------------------------------------
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npx vitest run

      # Cargo tests require native FFmpeg + libclang headers; only run on Linux
      # where the full system dependency set is installed above.
      - name: Run Cargo Test Suite
        if: matrix.platform == 'ubuntu-24.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ------------------------------------------------------------------------
      # Build and Publish Release Artifacts with In-App Updater Signatures
      # ------------------------------------------------------------------------
      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri v2 Auto-Updater Private Key & Password
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Clypra v__VERSION__"
          releaseBody: "Automated multi-platform release bundle containing installers for macOS, Windows, and Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
