name: Feature Request
description: Suggest a feature or improvement
title: "[Feature]: "
labels: ["type: feature"]

body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: Describe the limitation or workflow gap you're running into.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      placeholder: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, mockups, or examples from other editors are welcome.
