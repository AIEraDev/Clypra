name: Bug Report
description: Report a bug in Clypra
title: "[Bug]: "
labels: ["type: bug"]

body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.3.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug and steps to reproduce it.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any error messages or attach screenshots.
      render: shell
