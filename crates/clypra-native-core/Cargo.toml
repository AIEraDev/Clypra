[package]
name = "clypra-native-core"
version = "0.1.0"
edition = "2021"
description = "Platform-neutral contracts and deterministic runtime primitives for Clypra native rendering"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fontdue = "0.9"
parking_lot = "0.12"
woff2 = { package = "woff2-patched", version = "0.4" }
