[package]
name = "clypra-render-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-side wgpu compositor for Clypra Studio — same render core as the native daemon, compiled to WASM/WebGPU"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
clypra-native-core = { path = "../clypra-native-core" }
bytemuck    = { version = "1.21", features = ["derive"] }
image       = { version = "0.25", default-features = false, features = ["png"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
log         = "0.4"

# wasm-bindgen surface
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }

# futures::channel::oneshot — WASM-compatible async channel for map_async readback.
# Used in the wasm32 path of multi_track_composer.rs instead of
# tokio::sync::oneshot (which is not available on wasm32).
[dependencies.futures]
version = "0.3"
default-features = false
features = ["alloc"]   # provides futures::channel without std executor

# wgpu — BROWSER_WEBGPU primary, WebGL2 fallback for Firefox/Linux
[dependencies.wgpu]
version  = "24.0"
features = ["webgpu", "webgl"]

# getrandom needs the js feature to work inside wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
